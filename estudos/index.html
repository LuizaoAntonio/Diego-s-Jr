<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limbo of Memories - Ranking</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        // ==========================================
        // DADOS DE FALLBACK (caso a API falhe)
        // ==========================================
        const rankingFallback = [
            { id: 1, posicao: 1, nome: "YunoYuzuki", fitas: 7, fitasOuro: 2, cartas: 16, tempo: "15m", tag: "0073" },
            { id: 2, posicao: 2, nome: "Rafakvv", fitas: 7, fitasOuro: 2, cartas: 15, tempo: "38m", tag: "9964" },
            { id: 3, posicao: 3, nome: "murilojurema", fitas: 6, fitasOuro: 1, cartas: 13, tempo: "1h 25m", tag: "5570" },
            { id: 4, posicao: 4, nome: "eu_manyu", fitas: 2, fitasOuro: 0, cartas: 5, tempo: "14m", tag: "9973" },
            { id: 5, posicao: 5, nome: "pirilampo", fitas: 2, fitasOuro: 0, cartas: 5, tempo: "23m", tag: "5117" }
        ];

        // ==========================================
        // COMPONENTE: CabecalhoLimbo
        // RESPONSÁVEL: Mariane
        // ==========================================
        function CabecalhoLimbo() {
            return (
                <header className="cabecalho">
                    <div className="cabecalho-logo">
                        <span className="logo-icone">🎞️</span>
                        <div>
                            <h1 className="logo-titulo">Limbo of Memories</h1>
                            <p className="logo-sub">Ranking do Grupo</p>
                        </div>
                    </div>
                    <nav className="cabecalho-nav">
                        <span className="nav-item ativo">🏆 Ranking</span>
                        <span className="nav-item">👥 Social</span>
                        <span className="nav-item">💬 Chat</span>
                    </nav>
                </header>
            );
        }

        // ==========================================
        // COMPONENTE: PodioRanking
        // RESPONSÁVEL: Tadeu
        // ==========================================
        function PodioRanking({ jogadores }) {
            if (!jogadores || jogadores.length === 0) return null;

            const top3 = [...jogadores]
                .filter(j => j.posicao <= 3)
                .sort((a, b) => a.posicao - b.posicao);

            // Ordem visual clássica do pódio: 2º | 1º | 3º
            const ordemVisual = [
                top3.find(p => p.posicao === 2),
                top3.find(p => p.posicao === 1),
                top3.find(p => p.posicao === 3)
            ].filter(Boolean);

            const medalhas = { 1: "🥇", 2: "🥈", 3: "🥉" };

            return (
                <section className="podio">
                    <h2 className="titulo-podio">🏆 Top Players do Limbo</h2>
                    <div className="podio-container">
                        {ordemVisual.map((player) => (
                            <div
                                key={player.id}
                                className={`podio-card lugar-${player.posicao}`}
                            >
                                <div className="medalha">{medalhas[player.posicao] || `${player.posicao}º`}</div>
                                <div className="avatar-placeholder">
                                    {player.nome.charAt(0).toUpperCase()}
                                </div>
                                <h3 className="nome-player">{player.nome}</h3>
                                {player.tag && <p className="tag-player">#{player.tag}</p>}
                                <div className="stats-player">
                                    <span title="Fitas">🎞 {player.fitas}</span>
                                    <span className="ouro" title="Fitas de Ouro">✦ {player.fitasOuro}</span>
                                    <span title="Cartas">✉ {player.cartas}</span>
                                </div>
                                <span className="tempo-player">⏱ {player.tempo}</span>
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        // ==========================================
        // COMPONENTE: BarraLateralFiltros
        // RESPONSÁVEL: Pedro Guedes
        // ==========================================
        function BarraLateralFiltros({ onSearch, onFilter, filtroAtivo }) {
            const [termoBusca, setTermoBusca] = React.useState("");

            const handleBusca = (e) => {
                const valor = e.target.value;
                setTermoBusca(valor);
                if (onSearch) onSearch(valor);
            };

            const handleFiltro = (tipo) => {
                if (onFilter) onFilter(tipo);
            };

            return (
                <aside className="barra-filtros">
                    <h3 className="titulo-filtros">Filtros do Ranking</h3>

                    <div className="campo-busca">
                        <label htmlFor="busca-jogador">Buscar jogador</label>
                        <input
                            id="busca-jogador"
                            type="text"
                            placeholder="Nome ou ID..."
                            value={termoBusca}
                            onChange={handleBusca}
                            className="input-busca"
                        />
                    </div>

                    <div className="grupo-botoes-filtro">
                        <p className="subtitulo-filtro">Ordenar por</p>

                        <button
                            type="button"
                            className={`btn-filtro ${filtroAtivo === "fitas" ? "ativo" : ""}`}
                            onClick={() => handleFiltro("fitas")}
                        >
                            🎞 Mais Fitas
                        </button>

                        <button
                            type="button"
                            className={`btn-filtro ${filtroAtivo === "tempo" ? "ativo" : ""}`}
                            onClick={() => handleFiltro("tempo")}
                        >
                            ⏱ Menor Tempo
                        </button>

                        <button
                            type="button"
                            className={`btn-filtro ${filtroAtivo === "cartas" ? "ativo" : ""}`}
                            onClick={() => handleFiltro("cartas")}
                        >
                            ✉ Mais Cartas
                        </button>

                        <button
                            type="button"
                            className={`btn-filtro ${filtroAtivo === "ouro" ? "ativo" : ""}`}
                            onClick={() => handleFiltro("ouro")}
                        >
                            ✦ Mais Fitas de Ouro
                        </button>

                        <button
                            type="button"
                            className={`btn-filtro btn-reset ${filtroAtivo === "padrao" ? "ativo" : ""}`}
                            onClick={() => handleFiltro("padrao")}
                        >
                            ↺ Ordem Padrão
                        </button>
                    </div>
                </aside>
            );
        }

        // ==========================================
        // COMPONENTE: ContadorColecionaveis
        // RESPONSÁVEL: Luiz
        // ==========================================
        function ContadorColecionaveis() {
            // Dados de exemplo (substitua pelos dados do usuário logado)
            const stats = {
                fitas: 0,
                fitasOuro: 0,
                cartas: 0,
                tempo: "0m"
            };

            return (
                <div className="contador-colecionaveis">
                    <h3 className="titulo-contador">Seu Progresso</h3>
                    <div className="contador-grid">
                        <div className="contador-item">
                            <span className="contador-icone">🎞</span>
                            <span className="contador-valor">{stats.fitas}</span>
                            <span className="contador-label">Fitas</span>
                        </div>
                        <div className="contador-item">
                            <span className="contador-icone ouro">✦</span>
                            <span className="contador-valor">{stats.fitasOuro}</span>
                            <span className="contador-label">Ouro</span>
                        </div>
                        <div className="contador-item">
                            <span className="contador-icone">✉</span>
                            <span className="contador-valor">{stats.cartas}</span>
                            <span className="contador-label">Cartas</span>
                        </div>
                        <div className="contador-item">
                            <span className="contador-icone">⏱</span>
                            <span className="contador-valor">{stats.tempo}</span>
                            <span className="contador-label">Tempo</span>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // COMPONENTE: LinhaJogador
        // RESPONSÁVEL: Matheus
        // ==========================================
        function LinhaJogador({ jogador }) {
            if (!jogador) return null;

            return (
                <div className="linha-jogador">
                    <span className="posicao">{jogador.posicao}º</span>
                    <div className="info-jogador">
                        <span className="nome">{jogador.nome}</span>
                        {jogador.tag && <span className="tag">#{jogador.tag}</span>}
                    </div>
                    <div className="stats">
                        <span title="Fitas">🎞 {jogador.fitas}</span>
                        <span className="ouro" title="Fitas de Ouro">✦ {jogador.fitasOuro}</span>
                        <span title="Cartas">✉ {jogador.cartas}</span>
                    </div>
                    <span className="tempo">⏱ {jogador.tempo}</span>
                </div>
            );
        }

        // ==========================================
        // COMPONENTE: RodapeLimbo
        // RESPONSÁVEL: Pedro Cassiano
        // ==========================================
        function RodapeLimbo() {
            return (
                <footer className="rodape">
                    <p>Limbo of Memories · Ranking · Feito com 💜 pela equipe</p>
                    <div className="rodape-links">
                        <a href="https://limboofmemories.netlify.app/" target="_blank" rel="noopener noreferrer">Site Oficial</a>
                        <span>·</span>
                        <a href="https://yunoyuzuki.itch.io/limbo-of-memories" target="_blank" rel="noopener noreferrer">Baixar no itch.io</a>
                    </div>
                </footer>
            );
        }

        // ==========================================
        // TELA PRINCIPAL
        // ==========================================
        function App() {
            const [rankingJogadores, setRankingJogadores] = React.useState([]);
            const [carregando, setCarregando] = React.useState(true);
            const [erro, setErro] = React.useState(null);
            const [filtroAtivo, setFiltroAtivo] = React.useState("padrao");
            const [termoBusca, setTermoBusca] = React.useState("");

            React.useEffect(() => {
                fetch("https://limboofmemories.netlify.app/api/ranking")
                    .then((resposta) => {
                        if (!resposta.ok) throw new Error("Erro ao carregar ranking");
                        return resposta.json();
                    })
                    .then((dados) => {
                        const mapeado = Array.isArray(dados)
                            ? dados.map((item, index) => {
                                const segundos = item.playtime_seconds || item.tempo_segundos || 0;
                                const horas = Math.floor(segundos / 3600);
                                const minutos = Math.floor((segundos % 3600) / 60);
                                const tempoFormatado = horas > 0
                                    ? `${horas}h ${minutos}m`
                                    : `${minutos}m`;

                                return {
                                    id: item.id || index + 1,
                                    posicao: index + 1,
                                    nome: item.username || item.nickname || item.nome || "Jogador",
                                    fitas: item.fitas_normais || item.fitas || 0,
                                    fitasOuro: item.fitas_douradas || item.fitasOuro || 0,
                                    cartas: item.cartas || 0,
                                    tempo: tempoFormatado,
                                    tag: item.player_tag || item.tag || null
                                };
                            })
                            : rankingFallback;

                        setRankingJogadores(mapeado.length > 0 ? mapeado : rankingFallback);
                        setCarregando(false);
                    })
                    .catch((err) => {
                        console.error("Erro na API do Limbo:", err);
                        setErro("Não foi possível carregar o ranking. Usando dados de exemplo.");
                        setRankingJogadores(rankingFallback);
                        setCarregando(false);
                    });
            }, []);

            // Filtra e ordena a lista
            const listaFiltrada = React.useMemo(() => {
                let lista = [...rankingJogadores];

                if (termoBusca.trim()) {
                    const termo = termoBusca.toLowerCase();
                    lista = lista.filter(j =>
                        j.nome.toLowerCase().includes(termo) ||
                        String(j.id).includes(termo) ||
                        (j.tag && j.tag.toLowerCase().includes(termo))
                    );
                }

                if (filtroAtivo === "fitas") {
                    lista.sort((a, b) => b.fitas - a.fitas || b.fitasOuro - a.fitasOuro);
                } else if (filtroAtivo === "cartas") {
                    lista.sort((a, b) => b.cartas - a.cartas);
                } else if (filtroAtivo === "ouro") {
                    lista.sort((a, b) => b.fitasOuro - a.fitasOuro || b.fitas - a.fitas);
                } else if (filtroAtivo === "tempo") {
                    const paraMinutos = (t) => {
                        if (!t) return 9999;
                        const h = t.match(/(\d+)h/);
                        const m = t.match(/(\d+)m/);
                        return (h ? parseInt(h[1]) * 60 : 0) + (m ? parseInt(m[1]) : 0);
                    };
                    lista.sort((a, b) => paraMinutos(a.tempo) - paraMinutos(b.tempo));
                }

                return lista.map((j, i) => ({ ...j, posicao: i + 1 }));
            }, [rankingJogadores, filtroAtivo, termoBusca]);

            return (
                <div className="app-container">
                    <CabecalhoLimbo />

                    <main className="tela-ranking">
                        {carregando ? (
                            <div className="carregando">
                                <p>Carregando registros do Limbo...</p>
                            </div>
                        ) : (
                            <>
                                {erro && <p className="aviso-erro">{erro}</p>}

                                <ContadorColecionaveis />

                                <PodioRanking jogadores={rankingJogadores} />

                                <div className="conteudo-flex">
                                    <BarraLateralFiltros
                                        onSearch={setTermoBusca}
                                        onFilter={setFiltroAtivo}
                                        filtroAtivo={filtroAtivo}
                                    />

                                    <section className="lista-ranking">
                                        <h3 className="titulo-lista">
                                            Ranking Completo
                                            <span className="total-jogadores"> ({listaFiltrada.length})</span>
                                        </h3>

                                        {listaFiltrada.length === 0 ? (
                                            <p className="sem-resultados">Nenhum jogador encontrado.</p>
                                        ) : (
                                            listaFiltrada.map((jogador) => (
                                                <LinhaJogador key={jogador.id || jogador.posicao} jogador={jogador} />
                                            ))
                                        )}
                                    </section>
                                </div>
                            </>
                        )}
                    </main>

                    <RodapeLimbo />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
